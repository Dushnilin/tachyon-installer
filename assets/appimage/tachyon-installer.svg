<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#151D2F"/>
      <stop offset="40%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Tachyon Lightning Beam Gradient -->
    <linearGradient id="tachyon-beam" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="30%" stop-color="#38BDF8"/>
      <stop offset="65%" stop-color="#818CF8"/>
      <stop offset="85%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Inner Core Glow -->
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="pulse-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas (App Icon Shape) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" stroke="url(#rim-grad)" stroke-width="4"/>

  <!-- Subtle Network Speed Wave Rings -->
  <circle cx="256" cy="256" r="184" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#818CF8" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="12 6"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.18"/>

  <!-- Network Nodes & Wave Particles -->
  <circle cx="72" cy="256" r="4" fill="#00F0FF" opacity="0.6"/>
  <circle cx="440" cy="256" r="4" fill="#C084FC" opacity="0.6"/>
  <circle cx="256" cy="72" r="4" fill="#38BDF8" opacity="0.6"/>
  <circle cx="256" cy="440" r="4" fill="#818CF8" opacity="0.6"/>

  <circle cx="125" cy="125" r="3" fill="#00F0FF" opacity="0.4"/>
  <circle cx="387" cy="125" r="3" fill="#C084FC" opacity="0.4"/>
  <circle cx="125" cy="387" r="3" fill="#38BDF8" opacity="0.4"/>
  <circle cx="387" cy="387" r="3" fill="#818CF8" opacity="0.4"/>

  <!-- Background Ambient Glow behind Lightning -->
  <path d="M 296,80 L 160,268 L 244,268 L 216,432 L 352,244 L 268,244 Z" fill="url(#tachyon-beam)" opacity="0.3" filter="url(#pulse-blur)"/>

  <!-- Central Tachyon Bolt / Particle Beam -->
  <path d="M 296,80 L 160,268 L 244,268 L 216,432 L 352,244 L 268,244 Z" fill="url(#tachyon-beam)" filter="url(#neon-glow)"/>

  <!-- Inner High-Velocity Core -->
  <path d="M 290,98 L 180,260 L 244,260 L 226,400 L 332,252 L 268,252 Z" fill="url(#core-glow)" opacity="0.65"/>

  <!-- Modern Corner Accent Dots -->
  <rect x="56" y="56" width="6" height="6" rx="2" fill="#00F0FF" opacity="0.8"/>
  <rect x="450" y="56" width="6" height="6" rx="2" fill="#38BDF8" opacity="0.8"/>
  <rect x="56" y="450" width="6" height="6" rx="2" fill="#818CF8" opacity="0.8"/>
  <rect x="450" y="450" width="6" height="6" rx="2" fill="#C084FC" opacity="0.8"/>
</svg>
