<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="100%">
  <defs>
    <linearGradient id="divider-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F0FF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1"/>
      <stop offset="80%" stop-color="#C084FC" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <line x1="40" y1="12" x2="1160" y2="12" stroke="url(#divider-grad)" stroke-width="1.5" filter="url(#glow)"/>
  <circle cx="600" cy="12" r="3.5" fill="#00F0FF" filter="url(#glow)"/>
  <polygon points="600,6 605,12 600,18 595,12" fill="#818CF8"/>
</svg>
