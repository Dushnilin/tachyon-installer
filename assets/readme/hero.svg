<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <title>Tachyon Installer — OpenWrt Deployment &amp; Diagnostic TUI</title>

  <!-- Base Surface -->
  <rect width="1200" height="440" rx="10" fill="#0f0f10"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="9.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <!-- Top Bar -->
  <rect x="1" y="1" width="1198" height="40" rx="9" fill="#141415"/>
  <line x1="1" y1="41" x2="1199" y2="41" stroke="#2e2e32" stroke-width="1"/>
  <circle cx="24" cy="21" r="4.5" fill="#2e2e32"/>
  <circle cx="40" cy="21" r="4.5" fill="#2e2e32"/>
  <circle cx="56" cy="21" r="4.5" fill="#2e2e32"/>
  <text x="600" y="25" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#a1a1a6">tachyon-installer — ssh root@192.168.1.1:22 — OpenWrt 23.05–25.12 (APK / OPKG)</text>
  <text x="1176" y="25" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#4cc38a">v1.14.0</text>

  <!-- Title & Subtitle -->
  <g transform="translate(44, 68)">
    <text x="0" y="28" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="30" fill="#ededed" letter-spacing="-0.5">Tachyon Installer</text>
    <rect x="256" y="8" width="108" height="22" rx="4" fill="#19191b" stroke="#2e2e32" stroke-width="1"/>
    <text x="310" y="23" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#38bdf8">tachyon-core</text>
    <text x="0" y="54" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="14" fill="#a1a1a6">Автономное развертывание, диагностика и обслуживание маршрутизаторов OpenWrt через SSH без доступа роутера к сети</text>
  </g>

  <!-- Left Panel: Host Workstation -->
  <g transform="translate(44, 146)">
    <rect width="360" height="214" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
    <rect x="1" y="1" width="358" height="34" rx="7" fill="#19191b"/>
    <line x1="1" y1="35" x2="359" y2="35" stroke="#2e2e32" stroke-width="1"/>
    <text x="18" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="12" fill="#ededed">Рабочая станция (Host PC)</text>
    <text x="342" y="22" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#71717a">Win / Linux / macOS</text>

    <text x="18" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#38bdf8">[1] Параллельный выбор зеркала GitHub</text>
    <text x="34" y="80" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#71717a">direct · gh-proxy · ghfast · ddlc</text>

    <text x="18" y="108" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#ededed">[2] Контроль целостности пакетов</text>
    <text x="34" y="126" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#71717a">SHA-256 + проверка заголовков .apk / .ipk</text>

    <text x="18" y="154" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#ededed">[3] Локальный снимок конфигурации</text>
    <text x="34" y="172" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#71717a">/etc/config/tachyon · network · firewall · dhcp</text>

    <text x="18" y="198" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4cc38a">[✓] Роутеру не требуется выход в интернет</text>
  </g>

  <!-- Center Transport Connector -->
  <g transform="translate(420, 222)">
    <line x1="0" y1="32" x2="344" y2="32" stroke="#2e2e32" stroke-width="1.5"/>
    <line x1="0" y1="32" x2="344" y2="32" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6"/>
    <polygon points="352,32 340,27 340,37" fill="#38bdf8"/>

    <rect x="86" y="6" width="180" height="52" rx="6" fill="#141415" stroke="#38bdf8" stroke-width="1"/>
    <text x="176" y="27" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="12" fill="#38bdf8">tar-over-SSH → /tmp</text>
    <text x="176" y="45" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#a1a1a6">Поток в RAM без износа NAND</text>
  </g>

  <!-- Right Panel: OpenWrt Router -->
  <g transform="translate(788, 146)">
    <rect width="368" height="214" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
    <rect x="1" y="1" width="366" height="34" rx="7" fill="#19191b"/>
    <line x1="1" y1="35" x2="367" y2="35" stroke="#2e2e32" stroke-width="1"/>
    <text x="18" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="12" fill="#ededed">Целевой роутер OpenWrt</text>
    <text x="350" y="22" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#4cc38a">23.05 / 24.10 / 25.12</text>

    <text x="18" y="62" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#38bdf8">[1] Аудит ресурсов и пакетной базы</text>
    <text x="34" y="80" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#71717a">APK world scrub · замена ip-tiny ·/sys/module</text>

    <text x="18" y="108" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#ededed">[2] Единое ядро: tachyon-core (Rust)</text>
    <text x="34" y="126" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#71717a">Desync 2.0 · .trs · AWG 2.0 · Tailscale · FPTN</text>

    <text x="18" y="154" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#ededed">[3] Офлайн-установка и проверка туннеля</text>
    <text x="34" y="172" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#71717a">Fake-IP (v4/v6) · TProxy / TUN · KillSwitch</text>

    <text x="18" y="198" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#4cc38a">[✓] Автоматический откат при сбое запуска</text>
  </g>

  <!-- Bottom Technical Specs Bar -->
  <g transform="translate(44, 382)">
    <rect width="1112" height="34" rx="6" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
    <text x="20" y="21" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#a1a1a6">Архитектуры: <tspan fill="#ededed">aarch64 · armv7 · x86_64 · mipsel · mips · riscv64 · i386</tspan></text>
    <text x="1092" y="21" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#a1a1a6">Протоколы: <tspan fill="#38bdf8">VLESS · AWG 2.0 · Hy2 · FPTN · CSQTT · Tailscale</tspan></text>
  </g>
</svg>
