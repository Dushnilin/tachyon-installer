<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <title>Tachyon Installer - One-Click Cross-Platform Desktop Deployment &amp; Diagnostic Wizard</title>
  <defs>
    <!-- Background Space Gradients -->
    <radialGradient id="bg-space" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    
    <radialGradient id="cyan-glow" cx="80%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#00F0FF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="20%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Holographic Title Gradient -->
    <linearGradient id="holo-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Cyber Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.90"/>
    </linearGradient>

    <linearGradient id="stream-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.06"/>
      <circle cx="40" cy="40" r="1" fill="#00F0FF" fill-opacity="0.2"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulsePacket {
      0% { stroke-dashoffset: 200; opacity: 0.2; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.2; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .flow-line {
      stroke-dasharray: 10, 15;
      animation: pulsePacket 3s linear infinite;
    }
    .live-dot {
      animation: blink 2s infinite ease-in-out;
    }
  </style>

  <!-- Deep Canvas -->
  <rect width="1200" height="460" rx="16" fill="url(#bg-space)"/>
  <rect width="1200" height="460" rx="16" fill="url(#cyber-grid)"/>
  <rect width="1200" height="460" rx="16" fill="url(#cyan-glow)"/>
  <rect width="1200" height="460" rx="16" fill="url(#purple-glow)"/>

  <!-- Outer Neon Border -->
  <rect x="1.5" y="1.5" width="1197" height="457" rx="15" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Top Corner Telemetry -->
  <text x="45" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#00F0FF" letter-spacing="2">TACHYON // DESKTOP DEPLOYMENT CORE</text>
  <circle cx="360" cy="34" r="4" fill="#10B981" class="live-dot"/>
  <text x="372" y="38" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#10B981">LIVE SYSTEM</text>

  <text x="1155" y="38" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#64748B" letter-spacing="1.5">ONE-CLICK EXPRESS WIZARD</text>

  <!-- Main Hero Title -->
  <g transform="translate(45, 60)">
    <text x="0" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#holo-title)" letter-spacing="1">TACHYON INSTALLER</text>
    <text x="0" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94A3B8" letter-spacing="0.5">Автономный кроссплатформенный TUI-мастер развертывания и диагностики для OpenWrt</text>
  </g>

  <!-- Dual Cards Architecture Visual -->
  
  <!-- LEFT CARD: HOST PC -->
  <g transform="translate(45, 175)">
    <rect width="360" height="195" rx="12" fill="url(#card-grad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="360" height="38" rx="12" fill="#1E293B" fill-opacity="0.6"/>
    <circle cx="24" cy="19" r="5" fill="#38BDF8"/>
    <text x="38" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#F1F5F9">КОМПЬЮТЕР АДМИНИСТРАТОРА (HOST)</text>
    
    <!-- Specs -->
    <text x="24" y="65" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#38BDF8">OS: Windows • Linux • macOS</text>
    <text x="24" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#CBD5E1">⚡ Параллельный замер зеркал GitHub</text>
    <text x="24" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748B">  (gh-proxy.com, ghfast.top, ddlc, direct)</text>
    <text x="24" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#CBD5E1">🛡️ Верификация SHA256 пакетов</text>
    <text x="24" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#CBD5E1">💾 Локальный бэкап конфига роутера</text>
    <text x="24" y="187" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#10B981">✓ Интернет на роутере НЕ требуется</text>
  </g>

  <!-- CENTER: STREAM BEAM & TELEMETRY -->
  <g transform="translate(425, 230)">
    <!-- Main connecting line -->
    <path d="M 0 40 L 330 40" fill="none" stroke="url(#stream-beam)" stroke-width="3"/>
    <path d="M 0 40 L 330 40" fill="none" stroke="#00F0FF" stroke-width="2" class="flow-line"/>

    <!-- Pulse badge in the middle -->
    <g transform="translate(90, 15)">
      <rect width="150" height="48" rx="8" fill="#090D16" stroke="#00F0FF" stroke-width="1.2" filter="url(#neon-glow)"/>
      <text x="75" y="21" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace" font-weight="700" font-size="11.5" fill="#00F0FF">tar-over-SSH</text>
      <text x="75" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#94A3B8">Потоковая передача в RAM</text>
    </g>

    <!-- Arrow head -->
    <polygon points="340,40 325,33 325,47" fill="#38BDF8"/>
  </g>

  <!-- RIGHT CARD: OPENWRT ROUTER -->
  <g transform="translate(775, 175)">
    <rect width="380" height="195" rx="12" fill="url(#card-grad)" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.4"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="380" height="38" rx="12" fill="#1E293B" fill-opacity="0.6"/>
    <circle cx="24" cy="19" r="5" fill="#10B981"/>
    <text x="38" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#F1F5F9">ЦЕЛЕВОЙ РОУТЕР (OPENWRT 23.05 - 25.x)</text>

    <!-- Specs -->
    <text x="24" y="65" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" fill="#10B981">DEVICE: arm64 • mips • mipsle • x86_64</text>
    <text x="24" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#CBD5E1">🔍 7-точечная pre-flight диагностика</text>
    <text x="24" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#64748B">  (ОЗУ, Flash, nftables fw4, конфликты пакетов)</text>
    <text x="24" y="137" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#CBD5E1">⚡ Мульти-ядро: sing-box-ext / steer / lx</text>
    <text x="24" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" fill="#CBD5E1">🛡️ Безопасная установка в /tmp (Zero Wear)</text>
    <text x="24" y="187" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#38BDF8">✓ Авто-старт и проверка работоспособности</text>
  </g>

  <!-- Bottom Badges Row -->
  <g transform="translate(45, 400)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="110" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#F1F5F9">💻 Чистый Go (Zero Deps)</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="250" height="34" rx="17" fill="#1E293B" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="360" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#F1F5F9">🪞 Умный подбор быстрых зеркал</text>

    <!-- Pill 3 -->
    <rect x="500" y="0" width="230" height="34" rx="17" fill="#1E293B" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="615" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#F1F5F9">🔒 Защита флеш-памяти NAND</text>

    <!-- Pill 4 -->
    <rect x="745" y="0" width="210" height="34" rx="17" fill="#1E293B" stroke="#EAB308" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="850" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#F1F5F9">🌐 Проверка подписок в 1 клик</text>

    <!-- Pill 5 -->
    <rect x="970" y="0" width="185" height="34" rx="17" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="1062" y="21" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#F1F5F9">🚀 Windows • Linux • macOS</text>
  </g>
</svg>
