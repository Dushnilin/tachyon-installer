<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <title>Конвейер развертывания Tachyon Installer</title>

  <rect width="1200" height="350" rx="10" fill="#0f0f10"/>
  <rect x="0.5" y="0.5" width="1199" height="349" rx="9.5" fill="none" stroke="#2e2e32" stroke-width="1"/>

  <!-- Header -->
  <text x="44" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#ededed">Пятиэтапный конвейер автономного развертывания</text>
  <text x="1156" y="38" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" fill="#71717a">SSH transport · RAM staging · Offline APK/OPKG</text>
  <line x1="44" y1="52" x2="1156" y2="52" stroke="#2e2e32" stroke-width="1"/>

  <!-- Stage 1 -->
  <g transform="translate(44, 72)">
    <rect width="206" height="246" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
    <rect x="1" y="1" width="204" height="36" rx="7" fill="#19191b"/>
    <line x1="1" y1="37" x2="205" y2="37" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="11.5" fill="#38bdf8">1. SSH-аудит</text>

    <text x="16" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1a6">Профилирование роутера:</text>
    <text x="16" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Архитектура CPU</text>
    <text x="16" y="114" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Объем ОЗУ и Flash</text>
    <text x="16" y="138" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Менеджер APK / OPKG</text>
    <text x="16" y="162" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Модули /sys/module</text>
    <text x="16" y="186" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Проверка конфликтов</text>
    <text x="16" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">• Синхронизация часов</text>
  </g>

  <!-- Stage 2 -->
  <g transform="translate(270, 72)">
    <rect width="206" height="246" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
    <rect x="1" y="1" width="204" height="36" rx="7" fill="#19191b"/>
    <line x1="1" y1="37" x2="205" y2="37" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="11.5" fill="#38bdf8">2. Загрузка на ПК</text>

    <text x="16" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1a6">Подготовка пакетов:</text>
    <text x="16" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Замер зеркал GitHub</text>
    <text x="16" y="114" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Пакет tachyon + LuCI</text>
    <text x="16" y="138" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Ядро tachyon-core</text>
    <text x="16" y="162" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Локализация ru i18n</text>
    <text x="16" y="186" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Проверка SHA-256</text>
    <text x="16" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">• Валидация архивов</text>
  </g>

  <!-- Stage 3 -->
  <g transform="translate(496, 72)">
    <rect width="206" height="246" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
    <rect x="1" y="1" width="204" height="36" rx="7" fill="#19191b"/>
    <line x1="1" y1="37" x2="205" y2="37" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="11.5" fill="#38bdf8">3. Снимок и очистка</text>

    <text x="16" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1a6">Защита конфигурации:</text>
    <text x="16" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Бэкап UCI на ПК</text>
    <text x="16" y="114" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• tachyon snapshot-save</text>
    <text x="16" y="138" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Сброс stale-локов</text>
    <text x="16" y="162" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Очистка /etc/apk/world</text>
    <text x="16" y="186" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Замена ip-tiny → full</text>
    <text x="16" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">• Сохранение ключей</text>
  </g>

  <!-- Stage 4 -->
  <g transform="translate(722, 72)">
    <rect width="206" height="246" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
    <rect x="1" y="1" width="204" height="36" rx="7" fill="#19191b"/>
    <line x1="1" y1="37" x2="205" y2="37" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="11.5" fill="#38bdf8">4. Поток в /tmp</text>

    <text x="16" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1a6">Офлайн-установка:</text>
    <text x="16" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Поток tar-over-SSH</text>
    <text x="16" y="114" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Распаковка в /tmp</text>
    <text x="16" y="138" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• apk add --no-network</text>
    <text x="16" y="162" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Списки .trs / .srs</text>
    <text x="16" y="186" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Настройка UCI ядра</text>
    <text x="16" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717a">• Удаление временных</text>
  </g>

  <!-- Stage 5 -->
  <g transform="translate(948, 72)">
    <rect width="208" height="246" rx="8" fill="#141415" stroke="#2e2e32" stroke-width="1"/>
    <rect x="1" y="1" width="206" height="36" rx="7" fill="#19191b"/>
    <line x1="1" y1="37" x2="207" y2="37" stroke="#2e2e32" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-weight="600" font-size="11.5" fill="#4cc38a">5. Верификация</text>

    <text x="16" y="64" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1a6">Контроль запуска:</text>
    <text x="16" y="90" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Старт службы init.d</text>
    <text x="16" y="114" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Таблица nftables</text>
    <text x="16" y="138" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Резолв Fake-IP DNS</text>
    <text x="16" y="162" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Проверка карантина</text>
    <text x="16" y="186" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ededed">• Импорт подписок</text>
    <text x="16" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4cc38a">• Готовность LuCI [✓]</text>
  </g>
</svg>
